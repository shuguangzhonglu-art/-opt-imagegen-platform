services:
  imagegen-platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: imagegen-platform
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: "file:/app/data/prod.db"
      NODE_ENV: "production"
      PORT: "3000"
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      - ./public/generated:/app/public/generated
